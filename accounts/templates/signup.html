{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | FrameForge</title>
    <meta name="description" content="Create your free FrameForge account and start producing AI-powered video assets in minutes.">
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=3">
    <style>
        body { min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; }
        .auth-wrap { position:relative; z-index:10; width:100%; max-width:460px; padding:24px; }
        .auth-logo { text-align:center; margin-bottom:28px; }
        .auth-card { padding:40px 36px; box-shadow:0 40px 80px rgba(0,0,0,0.6),0 0 40px rgba(139,92,246,0.08); }
        .auth-heading { margin:0 0 6px; font-family:'Plus Jakarta Sans',sans-serif; font-size:24px; font-weight:800; color:var(--text); }
        .auth-sub { margin:0 0 24px; color:var(--muted); font-size:13px; }
        .pw-wrap { position:relative; }
        .pw-wrap .field-input { padding-right:42px; }
        .pw-eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; display:flex; align-items:center; transition:color 0.15s; }
        .pw-eye:hover { color:var(--text); }
        .auth-alert { padding:12px 16px; border-radius:12px; margin-bottom:20px; font-size:14px; }
        .auth-alert-error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#FCA5A5; }
        .pw-strength { height:3px; border-radius:99px; margin-top:6px; transition:all 0.3s; background:var(--border); }
        .pw-strength-weak { background:var(--red); width:33%; }
        .pw-strength-ok { background:var(--amber); width:66%; }
        .pw-strength-strong { background:var(--green); width:100%; }
        .auth-footer-link { margin:18px 0 0; text-align:center; color:var(--muted); font-size:13px; }
        .auth-back { text-align:center; margin-top:14px; }
        .auth-back a { color:var(--faint); font-size:12px; }
        .auth-back a:hover { color:var(--muted); }
    </style>
</head>
<body>

<div class="mesh-bg">
    <div class="mesh-bg-blob-1"></div>
    <div class="mesh-bg-blob-2"></div>
    <div class="mesh-bg-blob-3"></div>
    <div class="mesh-bg-grid"></div>
</div>

<div class="auth-wrap animate-in">
    <div class="auth-logo">
        <a href="{% url 'landing' %}"><span class="logo-text" style="font-size:24px;">FrameForge</span></a>
    </div>

    <div class="glass-panel auth-card">
        <h1 class="auth-heading">Create account</h1>
        <p class="auth-sub">Start creating AI video assets today — free</p>

        {% if error %}
        <div class="auth-alert auth-alert-error">{{ error }}</div>
        {% endif %}

        <form id="signupForm" method="POST" style="display:flex; flex-direction:column; gap:14px;">
            {% csrf_token %}
            <div class="field-group">
                <label class="field-label" for="id_username">Username</label>
                <input id="id_username" type="text" name="username" placeholder="Choose a username"
                       class="field-input" autocomplete="username" required autofocus>
            </div>
            <div class="field-group">
                <label class="field-label" for="id_email">Email</label>
                <input id="id_email" type="email" name="email" placeholder="you@example.com"
                       class="field-input" autocomplete="email" required>
            </div>
            <div class="field-group">
                <label class="field-label" for="id_password">Password</label>
                <div class="pw-wrap">
                    <input id="id_password" type="password" name="password" placeholder="Min. 8 characters"
                           class="field-input" autocomplete="new-password" required minlength="8"
                           oninput="checkStrength(this.value)">
                    <button type="button" class="pw-eye" onclick="togglePw('id_password', this)" aria-label="Toggle password">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div id="pwStrength" class="pw-strength"></div>
            </div>
            <div class="field-group">
                <label class="field-label" for="id_confirm">Confirm Password</label>
                <div class="pw-wrap">
                    <input id="id_confirm" type="password" name="confirm_password" placeholder="••••••••"
                           class="field-input" autocomplete="new-password" required>
                    <button type="button" class="pw-eye" onclick="togglePw('id_confirm', this)" aria-label="Toggle confirm password">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div style="margin-top:8px;">
                <button id="submitBtn" type="submit" class="btn btn-primary btn-lg btn-full">
                    <span class="spinner" id="spinner" style="display:none;"></span>
                    <span id="btnLabel">Create Account →</span>
                </button>
            </div>
        </form>

        <p class="auth-footer-link">
            Already have an account?
            <a href="{% url 'login' %}" style="color:#C4B5FD;font-weight:600;">Sign In</a>
        </p>
    </div>

    <div class="auth-back"><a href="{% url 'landing' %}">← Back to home</a></div>
</div>

<script>
function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    input.type = input.type === 'text' ? 'password' : 'text';
    btn.querySelector('svg').style.opacity = input.type === 'text' ? '0.5' : '1';
}
function checkStrength(val) {
    const bar = document.getElementById('pwStrength');
    bar.className = 'pw-strength';
    if (!val) return;
    if (val.length < 6) bar.classList.add('pw-strength-weak');
    else if (val.length < 10 || !/[A-Z]/.test(val) || !/[0-9]/.test(val)) bar.classList.add('pw-strength-ok');
    else bar.classList.add('pw-strength-strong');
}
document.getElementById('signupForm').addEventListener('submit', function(e) {
    const pw = document.getElementById('id_password').value;
    const cf = document.getElementById('id_confirm').value;
    if (pw !== cf) {
        e.preventDefault();
        alert('Passwords do not match.');
        return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    document.getElementById('spinner').style.display = 'inline-block';
    document.getElementById('btnLabel').textContent = 'Creating account…';
});
</script>
</body>
</html>
