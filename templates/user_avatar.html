{% with u=avatar_user|default:request.user %}
{% if u.is_authenticated and u.profile.avatar_url %}
<img src="{{ u.profile.avatar_url }}" alt="{{ u.profile.display_name|default:u.username }}" class="avatar-img" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;">
{% else %}
<span class="avatar-initial">{{ u.profile.initials|default:u.username|make_list|first|upper|default:"U" }}</span>
{% endif %}
{% endwith %}
